[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fare-signal"
version = "0.1.0"
description = "Flight-fare prediction, BUY/WAIT recommendations, and temporal backtesting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.5",
    "fastapi>=0.115",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "numpy>=2.0",
    "pydantic>=2.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.10"]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
fare-signal = "src.cli:main"

[tool.setuptools]
packages = ["src", "api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.vercel]
entrypoint = "api.predict:handler"
